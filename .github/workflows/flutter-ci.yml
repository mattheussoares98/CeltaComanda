name: Flutter CI/CD

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'  # Replace with your project version
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  deploy:
    runs-on: ubuntu-latest
    needs: build  # This job will run after the 'build' job 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download APK artifact
        uses: actions/download-artifact@v2
        with:
          name: app-release-apk

      - name: Set up environment variables (if needed)
        run: |
          echo "API_KEY=${{ secrets.API_KEY }}" >> $GITHUB_ENV  # Example of using a secret

      - name: Deploy APK or run additional tasks
        run: |
          # Use the downloaded APK for further deployment or tests
          echo "Deploy the APK or run any further tasks here"
